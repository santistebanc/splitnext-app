name: pages

# Publishes the public site on every push to main: the landing at `/`, and
# the Expo web export at `/app`. The slicer board is local-only
# (`npm run board:serve`) and must not become the production homepage (D-093).
#
# Per-PR slice pages still copy under /pr/N/ from the `pr-boards` branch
# so a CI comment can link them (D-055). They are not linked from the landing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export the web app
        env:
          EXPO_PUBLIC_API_URL: https://splitnext.santistebanc94.workers.dev
        run: npx expo export -p web

      - name: Assemble the site
        run: |
          python3 docs/scripts/assemble_pages.py --app dist --out _site
          if git fetch origin pr-boards:pr-boards 2>/dev/null; then
            mkdir -p _site/pr
            git archive pr-boards | tar -x -C _site/pr
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
