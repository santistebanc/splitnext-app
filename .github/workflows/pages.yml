name: pages

# Publishes two things to GitHub Pages on every push to main: the slicer board
# at the site root, and the app itself — a static Expo web export — at /app.
# The board describes the app; visitors should be one click from using it.
#
# One site rather than a second host: no extra account, no deploy token beyond
# the two EXPO_PUBLIC_ values the client ships anyway, and the board's "Open
# the app" link is same-origin. The trade is no per-PR *app* URL; a Vercel or
# Cloudflare project would give that if it ever earns its keep. The slice
# board is different: each PR gets its own page under /pr/N/, copied from the
# `pr-boards` branch (D-055).
#
# The board is generated, not committed: docs/slicer.html is gitignored and
# built here from docs/state/, so the published board can never be a stale
# copy someone forgot to regenerate.
#
# Media paths inside the board are relative (state/shots/...), so the whole
# docs/ directory ships as the site root, with slicer.html copied to
# index.html so the bare Pages URL lands on the board.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one rather than
# queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Regenerate the board
        run: python3 docs/scripts/generate-slicer-board.py

      # app.json's experiments.baseUrl pins the export to /splitnext-app/app,
      # so the bundle's asset links resolve under the subpath.
      - name: Export the web app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export -p web

      - name: Assemble the site
        run: |
          cp -r docs _site
          cp docs/slicer.html _site/index.html
          rm -rf _site/scripts/__pycache__
          mv dist _site/app
          # Per-PR slice boards live on the pr-boards branch so a reviewer can
          # open one before merge. Copy them under /pr/N/ without replacing /app.
          if git fetch origin pr-boards:pr-boards 2>/dev/null; then
            mkdir -p _site/pr
            git archive pr-boards | tar -x -C _site/pr
          fi
          # Expo emits underscore-prefixed paths (_expo/…), which Jekyll drops.
          touch _site/.nojekyll
          # Pages has no rewrite rule, so a reload on /app/group/<id> — a route
          # whose id only exists on the visitor's device — would 404. Serving
          # the app's own shell as the 404 page lets the router take it from
          # the URL instead.
          cp _site/app/index.html _site/app/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
