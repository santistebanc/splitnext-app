name: ci

# The gates a slice has to pass before it can merge: the test suite, the type
# checker, the board generator's own tests, and the state audit — the board and
# the map are how this repo is steered, so a broken one is a broken build.
# Capture runs (npm run capture) are deliberately not here — they drive the
# real deployed Edge Functions and would make CI depend on a live Supabase
# project.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The board generator is Python, so its seams cannot be reached from
      # Vitest. The call graph behind the Symbols tree is derived from source
      # rather than authored, and so is the map's own delta attribution, which
      # makes them the parts of the board that can be silently wrong — so they
      # are gated here rather than trusted (D-037).
      - name: Board tooling tests
        run: npm run test:board

      # The state files are how this repo is steered; the audit reads them
      # against the code and against git. Findings fail, notes do not.
      - name: State audit
        run: npm run audit
