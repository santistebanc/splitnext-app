name: ci

# Two required jobs. `check` is `npm run check` — the four fast gates, the
# laptop list (D-046, D-072). `capture` drives the recorded flows against a
# local Worker; it is not in `check` because Playwright + Metro are too slow
# for every save, and it needs no Cloudflare account.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the audit checks that every archive's claimed
      # tag exists and that no slice landed as two commits on main, and a
      # shallow clone has neither to look at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # One step, because the list of gates lives in package.json and nowhere
      # else: tests, typecheck, board tooling tests, state audit. A second copy
      # of that list here is a copy that drifts.
      #
      # The board generator is Python, so its seams cannot be reached from
      # Vitest. The call graph behind the Symbols tree is derived from source
      # rather than authored, and so is the map's own delta attribution, which
      # makes them the parts of the board that can be silently wrong (D-037).
      # The audit reads docs/state/ against the code and against git; findings
      # fail, notes do not.
      - name: Gates
        run: npm run check

  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Assert recorded flows
        run: npm run capture:ci
