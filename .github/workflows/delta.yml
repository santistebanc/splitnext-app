name: delta

# The slice view is a real slicer page, generated per PR, not a markdown
# comment and not a tab on the published board (D-055). Same chrome, only
# this slice: in flight from NEXT.md + the branch diff, or closed from the
# archive this branch added.
#
# Hosted on the `pr-boards` branch so a reviewer can open it before merge.
# Pages copies that branch into /pr/N/ on the next main deploy; the comment
# links the copy that is live now (jsDelivr at the commit sha).
#
# One comment, updated in place on every push: a thread of stale boards
# would be worse than none.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      # Full history: the report is measured from the merge base, which a
      # shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the slice board
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 docs/scripts/generate-slicer-board.py \
            --slice-page \
            --range "origin/$BASE" \
            --out slice.html
          python3 docs/scripts/delta.py \
            --range "origin/$BASE" \
            --title "What this slice changed, on the map" \
            > delta.md
          cat delta.md

      - name: Publish it to pr-boards
        id: publish
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          work=$(mktemp -d)
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$work" \
            || true
          cd "$work"
          if git fetch origin pr-boards:pr-boards 2>/dev/null; then
            git checkout pr-boards
          else
            git checkout --orphan pr-boards
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$PR"
          mkdir -p "$PR/state/shots"
          cp "$GITHUB_WORKSPACE/slice.html" "$PR/index.html"
          if [ -d "$GITHUB_WORKSPACE/docs/state/shots" ]; then
            cp -a "$GITHUB_WORKSPACE/docs/state/shots/." "$PR/state/shots/"
          fi
          git add "$PR"
          if git diff --cached --quiet; then
            echo "no change to the hosted board"
          else
            git commit -m "slice board for PR ${PR}"
            # Two PRs can land on this branch at once; rebase rather than clobber.
            git pull --rebase origin pr-boards || true
            git push origin pr-boards
          fi
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://cdn.jsdelivr.net/gh/${REPO}@${sha}/${PR}/index.html" >> "$GITHUB_OUTPUT"
          owner=${REPO%/*}
          name=${REPO#*/}
          echo "pages=https://${owner}.github.io/${name}/pr/${PR}/" >> "$GITHUB_OUTPUT"

      - name: Attach it as a deployment on the PR
        if: steps.publish.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha }}
          BOARD_URL: ${{ steps.publish.outputs.url }}
        run: |
          # A deployment with an environment_url is what GitHub shows as
          # "View deployment" on the PR — a comment link is easy to miss.
          id=$(jq -n \
            --arg ref "$REF" \
            '{
              ref: $ref,
              environment: "this-slice",
              description: "Slicer page for this slice",
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
              required_contexts: []
            }' | gh api "repos/$REPO/deployments" --input - --jq .id)
          gh api "repos/$REPO/deployments/$id/statuses" \
            -f state=success \
            -f environment="this-slice" \
            -f environment_url="$BOARD_URL" \
            -f log_url="$BOARD_URL" \
            -f description="Open the slice board" \
            > /dev/null
          echo "deployment $id → $BOARD_URL"

      - name: Post it, or update the one already there
        # `pull_request`, not `pull_request_target`: a fork's token is
        # read-only, so a fork PR gets no comment rather than handing a
        # write token to code from the fork.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BOARD_URL: ${{ steps.publish.outputs.url }}
          PAGES_URL: ${{ steps.publish.outputs.pages }}
        run: |
          marker='<!-- slicer-delta -->'
          {
            printf '%s\n\n' "$marker"
            if [ -n "$BOARD_URL" ]; then
              echo "## This slice"
              echo
              echo "Open the [slice board]($BOARD_URL) — the slicer page for this PR, not a file list."
              echo
              echo "The published board no longer carries the current slice. After the next merge to \`main\`, the same page also lives at ${PAGES_URL}."
              echo
              echo "<details><summary>Map delta (text)</summary>"
              echo
              cat "$GITHUB_WORKSPACE/delta.md"
              echo
              echo "</details>"
            else
              echo "## This slice"
              echo
              echo "_Fork PRs do not get a hosted board (no write token). Run locally:_ \`python3 docs/scripts/generate-slicer-board.py --slice-page\`"
              echo
              cat "$GITHUB_WORKSPACE/delta.md"
            fi
            echo
            echo "<sub>Generated by CI · \`npm run board -- --slice-page\` locally, or \`npm run delta\` for the text form.</sub>"
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" \
                 --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" \
              -F body=@body.md > /dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi
