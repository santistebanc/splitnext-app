name: delta

# What this branch changed, in the map's vocabulary, posted on the PR.
#
# GitHub already shows the file diff. What it cannot show is which *pieces* of
# the app moved — the `L-` rows a hunk actually landed on, the flows running
# through them, and what `NEXT.md` said each change was for. That reading used
# to live on the board's "This slice" page, rendered from the author's
# uncommitted working tree, which meant nobody but the author ever saw it and
# the published board never could (D-051).
#
# One comment, updated in place on every push: a thread of stale deltas would
# be worse than none.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      # Full history: the report is measured from the merge base, which a
      # shallow clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the report
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          {
            python3 docs/scripts/delta.py \
              --range "origin/$BASE" \
              --title "What this slice changed, on the map"
            echo
            echo "<sub>Generated by \`npm run delta\` · run it locally against your working tree while you build.</sub>"
          } > delta.md
          cat delta.md

      - name: Post it, or update the one already there
        # `pull_request`, not `pull_request_target`: a fork's token is
        # read-only, so a fork PR gets no comment rather than handing a
        # write token to code from the fork.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The marker is how the comment finds itself again on the next push.
          marker='<!-- slicer-delta -->'
          printf '%s\n' "$marker" | cat - delta.md > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" \
                 --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" \
              -F body=@body.md > /dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi
