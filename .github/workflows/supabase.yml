name: supabase

# Makes prod (`splitnext-v3`) equal to `main`, on every merge.
#
# Until this existed, migrations and Edge Functions shipped by hand, and the
# gap showed: the remote was missing the whole `expenses` table and served a
# stale `fetch-entity` for three slices after the archive said both shipped.
# Nothing checked, so nothing caught it.
#
# main only. No workflow_dispatch, no branch input: merging is the only thing
# that can move prod (D-052). Slice branches deploy to `splitnext-v3-dev`
# instead — see supabase-dev.yml (D-058).
on:
  push:
    branches: [main]

# One at a time, and never cancelled: a cancelled `db push` is a half-applied
# migration, which is worse than a queued one.
concurrency:
  group: supabase-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
    secrets:
      access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      anon_key: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
