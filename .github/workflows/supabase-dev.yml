name: supabase-dev

# Makes `splitnext-v3-dev` equal to the slice branch that was just pushed.
# Expo Go and `npm run web` (local `.env`) talk to this project, so an
# unmerged server change can be demoed before it lands on prod (D-058).
#
# `push` is additive `db push`. `workflow_dispatch` wipes the database and
# replays this repo's migrations — that is the start-of-server-slice reset,
# never an everyday push, and never prod.
on:
  push:
    branches: ['slice/**']
  workflow_dispatch:

concurrency:
  group: supabase-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-supabase.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
    secrets:
      access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      anon_key: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY_DEV }}
