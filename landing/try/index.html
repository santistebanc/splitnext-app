<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitNext — web</title>
    <link rel="icon" href="../favicon.png" type="image/png" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #d4d0c4;
      }
      .try-stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .try-sizer {
        position: relative;
        width: calc(440px * var(--phone-scale, 1));
        height: calc(920px * var(--phone-scale, 1));
      }
      .try-frame {
        position: absolute;
        top: 0;
        left: 0;
        box-sizing: content-box;
        width: 420px;
        height: 900px;
        border: 10px solid #1a1c16;
        border-radius: 28px;
        overflow: hidden;
        background: #f2efe8;
        box-shadow: 0 18px 50px rgba(26, 28, 22, 0.28);
        transform: scale(var(--phone-scale, 1));
        transform-origin: 0 0;
      }
      .try-frame iframe {
        display: block;
        width: 420px;
        height: 900px;
        border: 0;
        background: #f2efe8;
      }
      .try-back {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: #5c5f52;
        font: 600 28px/1 system-ui, sans-serif;
        text-decoration: none;
      }
      .try-back:hover {
        color: #1a1c16;
      }
    </style>
  </head>
  <body>
    <a class="try-back" href="../" aria-label="Back">←</a>
    <div class="try-stage">
      <div class="try-sizer">
        <div class="try-frame">
          <iframe
            id="app-frame"
            title="SplitNext"
            allow="clipboard-write"
          ></iframe>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var app = new URL("../app/", window.location.href).href;
        var PAD = 24,
          OW = 440,
          OH = 920,
          BP = 480;
        function fit() {
          var w = document.documentElement.clientWidth;
          var h = document.documentElement.clientHeight;
          if (w < BP) {
            window.location.replace(app);
            return;
          }
          var s = Math.max(0.2, Math.min((w - 2 * PAD) / OW, (h - 2 * PAD) / OH));
          document.documentElement.style.setProperty("--phone-scale", String(s));
        }
        document.getElementById("app-frame").src = app;
        fit();
        addEventListener("resize", fit);
        addEventListener("orientationchange", fit);
        if (window.visualViewport) visualViewport.addEventListener("resize", fit);
      })();
    </script>
  </body>
</html>
